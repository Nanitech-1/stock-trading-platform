services:
  # -------------------------------------------------------------
  # 1. Backend API Web Service (Node.js + Express + MongoDB)
  # -------------------------------------------------------------
  - type: web
    name: zerodha-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
      - key: OPENAI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # 2. Frontend Landing Page (React Static Site)
  # -------------------------------------------------------------
  - type: static
    name: zerodha-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: zerodha-backend
          property: host
      - key: REACT_APP_DASHBOARD_URL
        sync: false

  # -------------------------------------------------------------
  # 3. Kite Dashboard (React Static Site)
  # -------------------------------------------------------------
  - type: static
    name: zerodha-dashboard
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: zerodha-backend
          property: host
      - key: REACT_APP_FRONTEND_URL
        sync: false
